name: Build OrangeFox (community) for astonc

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: orangefox-aston
  cancel-in-progress: false

env:
  DEVICE: astonc
  OEM: oneplus
  TARGET: recoveryimage
  # 2 jobs to stay under the 16GB RAM limit (4 caused OOM-killed runners).
  J_VAL: "2"

jobs:
  build:
    # Standard runner: no larger runners available on this account.
    # A recovery-only build is much smaller than a full ROM, so we try it
    # with aggressive resource limits. If disk/RAM becomes a blocker, move
    # this job to Cirrus CI (free, 8 CPU/20GB) or a self-hosted VPS.
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout build config
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git curl wget unzip zip xz-utils zstd lz4 cpio rsync patchelf \
            openjdk-17-jdk python3 python3-pip build-essential \
            flex bison gperf bc ccache ninja-build \
            libssl-dev libxml2-utils libelf-dev libncurses-dev \
            python3-mako squashfs-tools jq

      - name: Add swap (best-effort, 24G)
        run: |
          sudo fallocate -l 24G /mnt/swapfile 2>/dev/null || true
          sudo chmod 600 /mnt/swapfile 2>/dev/null || true
          sudo mkswap /mnt/swapfile 2>/dev/null || true
          sudo swapon /mnt/swapfile 2>/dev/null || true
          free -h | head -3

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -sS https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "CI"
          git config --global user.email "ci@localhost"
          git lfs install

      - name: Check disk (before)
        run: df -h / | tail -1

      - name: Free disk space (remove preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/local/go /usr/local/.ghcup /opt/ghc \
            /usr/local/julia* /usr/share/swift
          sudo apt-get clean
          df -h / | tail -1

      - name: Sync OrangeFox sources (self-logging)
        run: |
          export GIT_TERMINAL_PROMPT=0
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=120
          LOG="$HOME/sync.log"
          : > "$LOG"
          log() { echo "[$(date -u +%FT%TZ)] $*" | tee -a "$LOG"; }
          log "host info"; nproc; free -h | head -3
          mkdir -p "$HOME/ofox"
          cd "$HOME/ofox"
          log "repo init"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0 \
            >> "$LOG" 2>&1 || { log "INIT_FAIL"; tail -50 "$LOG"; exit 1; }
          ok=0
          for i in 1 2 3; do
            log "SYNC_ATTEMPT=$i"
            # run sync in background writing to LOG; take its exit code
            repo sync -c -j2 --no-clone-bundle --no-tags >> "$LOG" 2>&1 &
            SPID=$!
            # heartbeat in foreground while sync runs
            while kill -0 $SPID 2>/dev/null; do
              sleep 60
              log "heartbeat alive"
            done
            wait $SPID; RC=$?
            log "SYNC_ATTEMPT_EXIT=$RC"
            if [ "$RC" = "0" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            log "SYNC_ALL_FAIL"
            echo "===== TAIL OF SYNC LOG ====="
            tail -120 "$LOG"
            exit 1
          fi
          log "SYNC_OK"
          log "check dirs"
          ls -d bootable vendor build device 2>/dev/null | head
          df -h / | tail -1

      - name: Prune unneeded trees (free disk for build)
        run: |
          cd "$HOME/ofox"
          # Remove only trees that are NOT part of the product dependency graph.
          # Keep: kernel/configs, art, development, prebuilts/clang, vendor/twrp,
          #       device/oneplus/astonc, device/qcom, system, external, frameworks,
          #       hardware, bionic, libcore, libnativehelper.
          for d in dalvik developers docs test cts sdk ndk \
                    packages/modules/Bluetooth packages/apps/Messaging; do
            rm -rf "$d" 2>/dev/null || true
          done
          # foreign device trees (not referenced by twrp_astonc)
          rm -rf device/xiaomi device/google device/samsung device/motorola \
                 device/sony device/asus device/oppo device/vivo device/realme \
                 device/lenovo device/tecno device/infinix device/oneplus/astonc-c-kernel \
                 device/oneplus/* 2>/dev/null || true
          mkdir -p device/oneplus/astonc
          df -h / | tail -1
          du -sh /home/runner/ofox 2>/dev/null || true

      - name: Upload sync log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-run-${{ github.run_number }}
          path: /home/runner/sync.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clone device tree + theme
        run: |
          set -eo pipefail
          cd "$HOME/ofox"
          mkdir -p device/oneplus
          # retry-friendly clone
          ok=0
          for i in 1 2 3; do
            echo "CLONE_DEVICE_ATTEMPT=$i"
            if git clone --depth=1 -b fox_16.0 \
              https://github.com/rkbkosp/android_device_oneplus_astonc_OrangeFox.git \
              device/oneplus/astonc; then
              ok=1; break
            fi
            rm -rf device/oneplus/astonc
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "CLONE_DEVICE_FAIL"; exit 1; }
          if [ ! -d bootable/recovery/gui/theme ]; then
            ok=0
            for i in 1 2 3; do
              echo "CLONE_THEME_ATTEMPT=$i"
              if git clone --depth=1 https://gitlab.com/OrangeFox/misc/theme.git \
                bootable/recovery/gui/theme; then
                ok=1; break
              fi
              rm -rf bootable/recovery/gui/theme
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "CLONE_THEME_FAIL"; exit 1; }
          fi
          echo "== device tree files =="
          ls device/oneplus/astonc | head -20
          [ -f device/oneplus/astonc/twrp_astonc.mk ] && echo "twrp_astonc.mk OK" || echo "WARN: no twrp_astonc.mk"

      - name: Check disk (after sync)
        run: df -h / | tail -1

      - name: Download and stage proprietary blobs (private release, via API)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          sudo apt-get install -y -qq erofs-utils
          mkdir -p "$HOME/blobs"
          cd "$HOME/blobs"
          for img in vendor odm; do
            echo "== resolve asset $img =="
            AID=$(curl -sS --retry 5 --retry-all-errors -m 120 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/Kiberbunny/orangefox-aston-blobs/releases/tags/blobs-v1" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['id'] for a in d.get('assets',[]) if a['name']=='${img}.img'][0])")
            echo "asset_id=$AID"
            curl -sS -L --retry 5 --retry-all-errors -m 1800 \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
              -o "$img.img" \
              "https://api.github.com/repos/Kiberbunny/orangefox-aston-blobs/releases/assets/$AID"
            ls -la "$img.img"
            file "$img.img"
            python3 "$GITHUB_WORKSPACE/scripts/verify_erofs.py" "$img.img"
            mkdir -p "${img}_out"
            fsck.erofs --extract=${img}_out "$img.img"
          done
          python3 "$GITHUB_WORKSPACE/scripts/stage_blobs.py" \
            --vendor-dir "$HOME/blobs/vendor_out" \
            --odm-dir "$HOME/blobs/odm_out" \
            --tree "$HOME/ofox/device/oneplus/astonc"

      - name: Remove test trees (unrecognized csuite_test module types)
        run: |
          cd "$HOME/ofox"
          rm -rf frameworks/base/libs/WindowManager/Shell/tests art/test 2>/dev/null || true
          # also clear other test dirs that may use csuite_test
          find frameworks art system hardware packages -type d \
            \( -name tests -o -name test \) -prune -exec rm -rf {} + 2>/dev/null || true
          echo "tests removed"
          df -h / | tail -1

      - name: Clone missing AOSP kernel/configs (soong rules)
        run: |
          cd "$HOME/ofox"
          if [ ! -d kernel/configs ]; then
            git clone --depth=1 https://android.googlesource.com/kernel/configs kernel/configs
          else
            echo "kernel/configs exists"
          fi
          ls -d kernel/configs

      - name: Patch recovery sources (AID_MEDIA_RW fallback for Android 16+)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/patch_aid_media.py" "$HOME/ofox/bootable/recovery"

      - name: Build recovery (self-logging)
        run: |
          set -eo pipefail
          cd "$HOME/ofox"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_BUILD_TYPE=Unofficial-CI
          export OF_MAINTAINER=Kiberbunny
          export LC_ALL=C
          export BUILD_USERNAME=buildbot
          export BUILD_HOSTNAME=ci
          # Device tree exports its own mandatory FOX_* variables.
          source device/oneplus/astonc/vendorsetup.sh
          source build/envsetup.sh
          echo "== lunch =="
          lunch twrp_astonc-bp2a-eng || { echo "LUNCH_FAIL"; exit 1; }
          echo "== build (j=$J_VAL) =="
          BUILD_LOG="$HOME/build.log"
          # Stop early with a clear message if disk is nearly full.
          AVAIL=$(df --output=avail -k / | tail -1)
          echo "available_kb=$AVAIL"
          if [ "${AVAIL:-0}" -lt 4000000 ]; then
            echo "FAIL: <4GB free disk before build (df=$(df -h / | tail -1))"
            exit 1
          fi
          if command -v mka >/dev/null 2>&1; then
            mka -j${J_VAL} $TARGET > "$BUILD_LOG" 2>&1
            RC=$?
          else
            make -j${J_VAL} $TARGET > "$BUILD_LOG" 2>&1
            RC=$?
          fi
          if [ "$RC" != "0" ]; then
            echo "===== BUILD FAILED (RC=$RC), хвост лога ====="
            tail -120 "$BUILD_LOG"
            echo "===== конец ====="
            exit "$RC"
          fi
          echo "BUILD_DONE"
          cp "$BUILD_LOG" /tmp/build_final.log 2>/dev/null || true
          ls -la "out/target/product/$DEVICE/"*.img 2>/dev/null | head

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-run-${{ github.run_number }}
          path: |
            /home/runner/build.log
            /tmp/build_final.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify recovery artifact (static)
        run: |
          set -e
          IMG="$HOME/ofox/out/target/product/$DEVICE/recovery.img"
          echo "== info =="
          ls -la "$IMG"
          file "$IMG"
          python3 "$GITHUB_WORKSPACE/scripts/verify_recovery.py" "$IMG" | tee /tmp/verification.txt

      - name: Upload recovery.img + verification report
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-${{ env.DEVICE }}-run-${{ github.run_number }}
          path: |
            /home/runner/ofox/out/target/product/${{ env.DEVICE }}/recovery.img
            /tmp/verification.txt
          if-no-files-found: error
          retention-days: 14


