name: Build OrangeFox (community) for astonc

on:
  workflow_dispatch:

concurrency:
  group: orangefox-aston
  cancel-in-progress: false

env:
  FOX_SYNC: https://gitlab.com/OrangeFox/sync.git
  SYNC_BRANCH: "16.0"
  DEVICE: astonc
  OEM: oneplus
  DT_LINK: "https://github.com/rkbkosp/android_device_oneplus_astonc_OrangeFox.git -b fox_16.0"
  TARGET: recoveryimage
  J_VAL: "4"

jobs:
  build:
    # Standard runner: no larger runners available on this account.
    # A recovery-only build is much smaller than a full ROM, so we try it
    # with aggressive resource limits. If disk/RAM becomes a blocker, move
    # this job to Cirrus CI (free, 8 CPU/20GB) or a self-hosted VPS.
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git curl wget unzip zip xz-utils zstd lz4 cpio rsync patchelf \
            openjdk-17-jdk python3 python3-pip build-essential \
            flex bison gperf bc ccache ninja-build \
            libssl-dev libxml2-utils libelf-dev libncurses-dev \
            python3-mako squashfs-tools jq

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Check disk (before)
        run: df -h / | tail -1

      - name: Sync OrangeFox sources (GitLab sync script)
        run: |
          git clone "$FOX_SYNC" "$HOME/sync"
          cd "$HOME/sync"
          bash orangefox_sync.sh --branch "$SYNC_BRANCH" --path "$HOME/ofox"

      - name: Clone device tree + theme
        run: |
          cd "$HOME/ofox"
          mkdir -p device/oneplus
          git clone --depth=1 -b fox_16.0 \
            https://github.com/rkbkosp/android_device_oneplus_astonc_OrangeFox.git \
            device/oneplus/astonc
          if [ ! -d bootable/recovery/gui/theme ]; then
            git clone --depth=1 https://gitlab.com/OrangeFox/misc/theme.git \
              bootable/recovery/gui/theme || echo "theme clone failed (ignored)"
          fi

      - name: Check disk (after sync)
        run: df -h / | tail -1

      - name: Build recovery
        run: |
          cd "$HOME/ofox"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_BUILD_TYPE=Unofficial-CI
          export OF_MAINTAINER=Kiberbunny
          export LC_ALL=C
          export BUILD_USERNAME=buildbot
          export BUILD_HOSTNAME=ci
          source build/envsetup.sh
          lunch twrp_$DEVICE-eng
          mka -j${J_VAL} $TARGET

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-${{ env.DEVICE }}-run-${{ github.run_number }}
          path: |
            ${{ runner.home }}/ofox/out/target/product/${{ env.DEVICE }}/recovery.img
          if-no-files-found: error
          retention-days: 14
